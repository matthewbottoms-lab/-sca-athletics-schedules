name: Refresh SCA schedules

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
      timezone: 'America/Phoenix'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sca-schedules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch and convert schedules
        run: npm run refresh

      - name: Save refreshed schedule data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No schedule-data changes to commit."
          else
            git commit -m "Update SCA schedule data"
            for attempt in 1 2 3; do
  if git push; then
    exit 0
  fi

  if [ "$attempt" -lt 3 ]; then
    echo "Push failed; rebasing on the latest branch and retrying (attempt $attempt of 3)."
    git fetch origin "$GITHUB_REF_NAME"
    git rebase "origin/$GITHUB_REF_NAME"
  fi
done

echo "Could not push refreshed schedule data after 3 attempts."
exit 1
          fi

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
